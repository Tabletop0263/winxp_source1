name: Build arcldr + XP kernel for Wii

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout winxp_source
        uses: actions/checkout@v4
        with:
          repository: Tabletop0263/winxp_source1
          path: winxp_source

      - name: Checkout entii
        uses: actions/checkout@v4
        with:
          repository: Wack0/entii-for-workcubes
          path: entii
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y make wget curl xz-utils gcc

      - name: Install devkitPPC r35 (powerpc-eabi toolchain)
        run: |
          set -euxo pipefail
          echo "=== Downloading devkitPPC r35 ==="
          curl -fsSL -o devkitppc.tar.xz \
            https://wii.leseratte10.de/devkitPro/devkitPPC/r35/devkitPPC_r35-linux.tar.xz
          echo "=== Extracting devkitPPC ==="
          sudo mkdir -p /opt/devkitpro
          sudo tar -xJf devkitppc.tar.xz -C /opt/devkitpro
          echo "DEVKITPPC=/opt/devkitpro/devkitPPC" >> $GITHUB_ENV
          echo "=== devkitPPC installed ==="
          ls -la /opt/devkitpro/devkitPPC/bin/powerpc-eabi-gcc

      - name: Install devkitppc-rules (wii_rules, base_rules, base_tools)
        run: |
          set -euxo pipefail
          echo "=== Downloading devkitppc-rules ==="
          curl -fsSL -o devkitppc-rules.tar.gz \
            https://github.com/devkitPro/devkitppc-rules/archive/refs/heads/master.tar.gz
          sudo tar -xzf devkitppc-rules.tar.gz -C /tmp
          sudo cp /tmp/devkitppc-rules-master/wii_rules /opt/devkitpro/devkitPPC/wii_rules
          sudo cp /tmp/devkitppc-rules-master/base_rules /opt/devkitpro/devkitPPC/base_rules
          sudo cp /tmp/devkitppc-rules-master/base_tools /opt/devkitpro/devkitPPC/base_tools
          echo "=== Rules installed ==="
          ls -la /opt/devkitpro/devkitPPC/wii_rules

      - name: Install elf2dol tool
        run: |
          set -euxo pipefail
          echo "=== Downloading gamecube-tools ==="
          curl -fsSL -o gamecube-tools.tar.gz \
            https://github.com/devkitPro/gamecube-tools/archive/refs/heads/master.tar.gz
          sudo tar -xzf gamecube-tools.tar.gz -C /tmp
          gcc /tmp/gamecube-tools-master/elftool/elf2dol.c -o /tmp/elf2dol
          sudo cp /tmp/elf2dol /usr/local/bin/elf2dol
          echo "=== elf2dol installed ==="
          which elf2dol
          elf2dol 2>&1 | head -1 || true

      - name: Install libogc (headers + libs for Wii)
        run: |
          set -euxo pipefail
          echo "=== Downloading libogc ==="
          curl -fsSL -o libogc.pkg.tar.xz \
            "https://wii.leseratte10.de/devkitPro/libogc/libogc_2.0.0%20(2020-06-11)/libogc-2.0.0-2-any.pkg.tar.xz"
          sudo tar -xJf libogc.pkg.tar.xz -C /
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "LIBOGC_INC=/opt/devkitpro/libogc/include" >> $GITHUB_ENV
          echo "LIBOGC_LIB=/opt/devkitpro/libogc/lib/wii" >> $GITHUB_ENV
          echo "=== libogc installed ==="
          ls -la /opt/devkitpro/libogc/lib/wii/libogc.a

      - name: Install libfat source (for fat.h header)
        run: |
          set -euxo pipefail
          echo "=== Downloading libfat ==="
          curl -fsSL -o libfat.tar.gz \
            https://github.com/devkitPro/libfat/archive/master.tar.gz
          sudo tar -xzf libfat.tar.gz -C /tmp
          sudo cp /tmp/libfat-master/include/fat.h /opt/devkitpro/libogc/include/fat.h
          echo '/* auto-generated by libfat build */' | sudo tee /opt/devkitpro/libogc/include/libfatversion.h > /dev/null
          echo '#define LIBFAT_VERSION_MAJOR 1' | sudo tee -a /opt/devkitpro/libogc/include/libfatversion.h > /dev/null
          echo '#define LIBFAT_VERSION_MINOR 0' | sudo tee -a /opt/devkitpro/libogc/include/libfatversion.h > /dev/null
          # libfat.a stub (arcldr links against it but doesn't use FAT at runtime)
          echo "=== Creating libfat.a stub ==="
          sudo rm -f /opt/devkitpro/libogc/lib/wii/libfat.a
          printf 'int fatMount(void *a, void *b) { return 0; }\n' > /tmp/fatmount_stub.c
          sudo /opt/devkitpro/devkitPPC/bin/powerpc-eabi-gcc -c /tmp/fatmount_stub.c -o /tmp/fatmount_stub.o
          sudo /opt/devkitpro/devkitPPC/bin/powerpc-eabi-ar rcs /opt/devkitpro/libogc/lib/wii/libfat.a /tmp/fatmount_stub.o
          sudo /opt/devkitpro/devkitPPC/bin/powerpc-eabi-ranlib /opt/devkitpro/libogc/lib/wii/libfat.a
          # Add _SHIFTL/_SHIFTR macros missing from this libogc version
          echo '#define _SHIFTL(v,s,w) (((v) & ((1 << (w)) - 1)) << (s))' | sudo tee -a /opt/devkitpro/libogc/include/gccore.h > /dev/null
          echo '#define _SHIFTR(v,s,w) (((v) >> (s)) & ((1 << (w)) - 1))' | sudo tee -a /opt/devkitpro/libogc/include/gccore.h > /dev/null
          echo "=== libfat stub done ==="
          /opt/devkitpro/devkitPPC/bin/powerpc-eabi-nm /opt/devkitpro/libogc/lib/wii/libfat.a | grep fatMount

      - name: Build arcldr for Wii (DOL)
        working-directory: entii/arcldr
        run: |
          set -euxo pipefail
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          export DEVKITPRO=/opt/devkitpro
          export PATH="$DEVKITPPC/bin:$PATH"
          echo "=== Environment ==="
          echo "DEVKITPPC=$DEVKITPPC"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "PATH=$PATH"
          which powerpc-eabi-gcc
          which elf2dol
          echo "=== Checking hwdesc.h path ==="
          ls -la ../inc/hwdesc.h
          echo "=== Patching _Static_assert ==="
          sed -i 's/_Static_assert((sizeof(HW_DESCRIPTION) % sizeof(unsigned long long)) == 0);/_Static_assert((sizeof(HW_DESCRIPTION) % sizeof(unsigned long long)) == 0, "");/' ../inc/hwdesc.h
          grep -n "_Static_assert" ../inc/hwdesc.h
          echo "=== Building arcldr ==="
          make -f Makefile.wii V=1
          echo "=== arcldr build complete ==="
          ls -la arcldr_rvl.dol arcldr_rvl.elf

      - name: Install LE PowerPC cross-compiler for XP kernel
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-powerpc64le-linux-gnu binutils-powerpc64le-linux-gnu
          echo "=== LE cross-compiler installed ==="
          which powerpc64le-linux-gnu-gcc
          which powerpc64le-linux-gnu-ld

      - name: Build XP kernel (little-endian ELF32)
        working-directory: winxp_source/Source/XPSP1/NT/base/build/ppc
        run: |
          set -euxo pipefail
          echo "=== Working directory ==="
          pwd
          ls -la
          echo "=== Source files check ==="
          ls ../../ntos/ppc/ppc.S
          ls ntos_entry.S
          rm -rf obj_le && mkdir obj_le

          # Assemble entry + vector stubs (ELF32 LE via gcc driver)
          powerpc64le-linux-gnu-gcc -m32 -c ../../ntos/ppc/ppc.S -o obj_le/ntos_ppc.o
          powerpc64le-linux-gnu-gcc -m32 -c ntos_entry.S -o obj_le/ntos_entry.o

          # Compile ntos C files
          for f in ntoskrnl ppcinit exceptn pcr; do
            powerpc64le-linux-gnu-gcc -m32 -mcpu=750 -mno-altivec -Wall -Werror -O2 -ffreestanding -nostdinc \
              -DPOWERPC -D_G3_ -DBROADWAY -DNT_UP -DNT_KERNEL -D_NTSYSTEM_ \
              -I../../ntos/inc/ppc -I../../ntos/inc -I../../ntdll/ppc \
              -I./inc_stub \
              -c ../../ntos/ppc/$f.c -o obj_le/$f.o
          done

          # Compile ntdll C files
          for f in context critsect dispatch ldrctx ldrthunk npxnp; do
            powerpc64le-linux-gnu-gcc -m32 -mcpu=750 -mno-altivec -Wall -Werror -O2 -ffreestanding -nostdinc \
              -DPOWERPC -D_G3_ -DBROADWAY -DNT_UP -DNT_KERNEL -D_NTSYSTEM_ \
              -I../../ntos/inc/ppc -I../../ntos/inc -I../../ntdll/ppc \
              -I./inc_stub \
              -c ../../ntdll/ppc/$f.c -o obj_le/ntdll_$f.o
          done

          # Compile HAL C files
          for f in halppc atomic interrupt context of display font8x8 pad disk fat; do
            powerpc64le-linux-gnu-gcc -m32 -mcpu=750 -mno-altivec -Wall -Werror -O2 -ffreestanding -nostdinc \
              -DPOWERPC -D_G3_ -DBROADWAY -DNT_UP -DNT_KERNEL -D_NTSYSTEM_ \
              -I../../ntos/inc/ppc -I../../ntos/inc -I../../ntdll/ppc \
              -I../../hals/halppc/ppc -I./inc_stub \
              -c ../../hals/halppc/ppc/$f.c -o obj_le/hal_$f.o
          done

          # Compile Config Manager registry files
          for f in cmregistry cmkey cmvalue cmcallback; do
            powerpc64le-linux-gnu-gcc -m32 -mcpu=750 -mno-altivec -Wall -Werror -O2 -ffreestanding -nostdinc \
              -DPOWERPC -D_G3_ -DBROADWAY -DNT_UP -DNT_KERNEL -D_NTSYSTEM_ \
              -I../../ntos/inc/ppc -I../../ntos/inc -I../../ntos/config \
              -I../../ntdll/ppc \
              -I./inc_stub \
              -c ../../ntos/config/$f.c -o obj_le/config_$f.o
          done

          # Compile Process/Thread module (PsCreateSystemThread)
          for f in pscreate psexit pslist; do
            powerpc64le-linux-gnu-gcc -m32 -mcpu=750 -mno-altivec -Wall -Werror -O2 -ffreestanding -nostdinc \
              -DPOWERPC -D_G3_ -DBROADWAY -DNT_UP -DNT_KERNEL -D_NTSYSTEM_ \
              -I../../ntos/inc/ppc -I../../ntos/inc -I../../ntdll/ppc \
              -I./inc_stub \
              -c ../../ntos/ps/$f.c -o obj_le/ntos_ps_$f.o
          done

          # Compile Object Manager module
          for f in obcreate obname; do
            powerpc64le-linux-gnu-gcc -m32 -mcpu=750 -mno-altivec -Wall -Werror -O2 -ffreestanding -nostdinc \
              -DPOWERPC -D_G3_ -DBROADWAY -DNT_UP -DNT_KERNEL -D_NTSYSTEM_ \
              -I../../ntos/inc/ppc -I../../ntos/inc -I../../ntdll/ppc \
              -I./inc_stub \
              -c ../../ntos/ob/$f.c -o obj_le/ntos_ob_$f.o
          done

          # Compile LPC module
          for f in lpc lpcport; do
            powerpc64le-linux-gnu-gcc -m32 -mcpu=750 -mno-altivec -Wall -Werror -O2 -ffreestanding -nostdinc \
              -DPOWERPC -D_G3_ -DBROADWAY -DNT_UP -DNT_KERNEL -D_NTSYSTEM_ \
              -I../../ntos/inc/ppc -I../../ntos/inc -I../../ntdll/ppc \
              -I./inc_stub \
              -c ../../ntos/lpc/$f.c -o obj_le/ntos_lpc_$f.o
          done

          # Compile Command shell module (CmdMain)
          for f in cmdmain cmds console; do
            powerpc64le-linux-gnu-gcc -m32 -mcpu=750 -mno-altivec -Wall -Werror -O2 -ffreestanding -nostdinc \
              -DPOWERPC -D_G3_ -DBROADWAY -DNT_UP -DNT_KERNEL -D_NTSYSTEM_ \
              -I../../ntos/inc/ppc -I../../ntos/inc -I../../ntdll/ppc \
              -I./inc_stub \
              -c ../../ntos/cmd/cmd/$f.c -o obj_le/ntos_cmd_$f.o
          done

          # Link ELF32 little-endian executable
          powerpc64le-linux-gnu-ld -m elf32lppc -Ttext 0x00000000 -nostdlib -static \
            -o ntoskrnl_le.elf \
            obj_le/hal_halppc.o obj_le/hal_atomic.o obj_le/hal_interrupt.o obj_le/hal_context.o obj_le/hal_of.o obj_le/hal_display.o obj_le/hal_font8x8.o obj_le/hal_pad.o obj_le/hal_disk.o obj_le/hal_fat.o \
            obj_le/ntdll_context.o obj_le/ntdll_dispatch.o obj_le/ntdll_critsect.o obj_le/ntdll_ldrctx.o obj_le/ntdll_ldrthunk.o obj_le/ntdll_npxnp.o \
            obj_le/config_cmregistry.o obj_le/config_cmkey.o obj_le/config_cmvalue.o obj_le/config_cmcallback.o \
            obj_le/ntos_ps_pscreate.o obj_le/ntos_ps_psexit.o obj_le/ntos_ps_pslist.o \
            obj_le/ntos_ob_obcreate.o obj_le/ntos_ob_obname.o \
            obj_le/ntos_lpc_lpc.o obj_le/ntos_lpc_lpcport.o \
            obj_le/ntos_cmd_cmdmain.o obj_le/ntos_cmd_cmds.o obj_le/ntos_cmd_console.o \
            obj_le/ppcinit.o obj_le/exceptn.o obj_le/pcr.o obj_le/ntos_ppc.o obj_le/ntoskrnl.o obj_le/ntos_entry.o

          powerpc64le-linux-gnu-readelf -h ntoskrnl_le.elf | grep -E "Class|Data|Machine|Type|Entry"
          powerpc64le-linux-gnu-nm ntoskrnl_le.elf | grep -c " U " | xargs echo "undefined symbols:"

      - name: Package Wii SD card layout
        run: |
          set -euxo pipefail
          echo "=== Packaging ==="
          mkdir -p wii_sd/nt
          mkdir -p wii_sd/apps/arcldr
          cp entii/arcldr/arcldr_rvl.dol wii_sd/apps/arcldr/boot.dol
          cp winxp_source/Source/XPSP1/NT/base/build/ppc/ntoskrnl_le.elf wii_sd/nt/arcfw.elf
          printf '%s\n' '# Wii SD Card Layout for XP Kernel Testing' > wii_sd/README.md
          printf '%s\n' '' >> wii_sd/README.md
          printf '%s\n' '## Files on SD card:' >> wii_sd/README.md
          printf '%s\n' '' >> wii_sd/README.md
          printf '%s\n' 'sd:/apps/arcldr/boot.dol   - entii arcldr loader (load via Homebrew Channel)' >> wii_sd/README.md
          printf '%s\n' 'sd:/nt/arcfw.elf           - XP kernel (little-endian ELF, entry via ModeSwitchEntry)' >> wii_sd/README.md
          printf '%s\n' '' >> wii_sd/README.md
          printf '%s\n' '## How to test:' >> wii_sd/README.md
          printf '%s\n' '' >> wii_sd/README.md
          printf '%s\n' '1. Copy the `wii_sd/` contents to the root of a FAT32 SD card.' >> wii_sd/README.md
          printf '%s\n' '2. Insert the SD card into your Wii.' >> wii_sd/README.md
          printf '%s\n' '3. Launch the Homebrew Channel.' >> wii_sd/README.md
          printf '%s\n' '4. Run `arcldr` from the Homebrew Channel.' >> wii_sd/README.md
          printf '%s\n' '5. arcldr will load `sd:/nt/arcfw.elf`, build the PHW_DESCRIPTION from your Wii'\''s' >> wii_sd/README.md
          printf '%s\n' '   hardware, and jump to the XP kernel'\''s `_start` via `ModeSwitchEntry`.' >> wii_sd/README.md
          printf '%s\n' '' >> wii_sd/README.md
          printf '%s\n' '## What to expect:' >> wii_sd/README.md
          printf '%s\n' '' >> wii_sd/README.md
          printf '%s\n' '- No visible output yet (no framebuffer/display driver in the kernel).' >> wii_sd/README.md
          printf '%s\n' '- The kernel initializes and spins waiting for interrupts.' >> wii_sd/README.md
          printf '%s\n' '- If the Wii doesn'\''t immediately crash/reboot, the entry convention and' >> wii_sd/README.md
          printf '%s\n' '  PHW_DESCRIPTION plumbing are working.' >> wii_sd/README.md
          printf '%s\n' '' >> wii_sd/README.md
          printf '%s\n' '## Notes:' >> wii_sd/README.md
          printf '%s\n' '' >> wii_sd/README.md
          printf '%s\n' '- This is experimental early code. The kernel may hang or crash.' >> wii_sd/README.md
          printf '%s\n' '- arcldr requires a Wii with Homebrew Channel installed.' >> wii_sd/README.md
          printf '%s\n' '- The kernel expects entii'\''s PHW_DESCRIPTION loader block in GPR r3.' >> wii_sd/README.md
          echo "=== Package complete ==="
          ls -la wii_sd/ wii_sd/apps/arcldr/ wii_sd/nt/

      - name: Upload Wii SD card package
        uses: actions/upload-artifact@v4
        with:
          name: wii-sd-package
          path: wii_sd/
          retention-days: 7

      - name: Upload kernel ELF separately
        uses: actions/upload-artifact@v4
        with:
          name: arcfw-kernel-elf
          path: winxp_source/Source/XPSP1/NT/base/build/ppc/ntoskrnl_le.elf
          retention-days: 7
